name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Whitespace and line endings
        run: |
          base=$(git hash-object -t tree /dev/null)
          git diff --check "$base" HEAD
          if git ls-files --eol | grep -E '^i/(crlf|mixed)'; then
            echo "Files above have CRLF line endings in the index." >&2
            exit 1
          fi

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build SubZeroDev.WindowManager.slnx -c Release
      - name: Keep crash dumps
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\SubZeroDev.WindowManager.Host.exe'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -Value "$env:RUNNER_TEMP\dumps" -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -Value 2 -PropertyType DWord -Force | Out-Null
      - name: Test
        run: dotnet test SubZeroDev.WindowManager.slnx -c Release --no-build --logger "console;verbosity=normal"
      - name: Crash events
        if: failure()
        shell: pwsh
        run: |
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Level = 2; StartTime = (Get-Date).AddHours(-1) } -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'SubZeroDev' } |
            Format-List TimeCreated, ProviderName, Message
      - name: Crash dump stacks
        if: failure()
        shell: pwsh
        run: |
          $dumps = Get-ChildItem "$env:RUNNER_TEMP\dumps" -Filter *.dmp -ErrorAction SilentlyContinue
          if (-not $dumps) { 'No dumps.'; exit 0 }
          dotnet tool install --global dotnet-dump | Out-Null
          foreach ($dump in $dumps) {
            "=== $($dump.Name)"
            dotnet-dump analyze $dump.FullName -c 'pe -nested' -c 'clrthreads' -c 'clrstack -all' -c 'exit'
          }
      - name: Upload crash dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-dumps
          path: ${{ runner.temp }}/dumps
          if-no-files-found: ignore

  budgets:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build SubZeroDev.WindowManager.slnx -c Release
      - name: Startup and idle against the CI budgets
        shell: pwsh
        env:
          SUBZERODEV_WM_BUDGETS: measure
          SUBZERODEV_WM_BUDGET_OUT: ${{ runner.temp }}/budgets
        run: |
          $tests = 'tests/SubZeroDev.WindowManager.EndToEnd.Tests/bin/Release/net10.0-windows10.0.26100.0/win-x64/SubZeroDev.WindowManager.EndToEnd.Tests.exe'
          & $tests -class SubZeroDev.WindowManager.EndToEnd.Tests.BudgetTests
          exit $LASTEXITCODE
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budgets
          path: ${{ runner.temp }}/budgets
          if-no-files-found: ignore
