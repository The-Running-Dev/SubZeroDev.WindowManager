name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Whitespace and line endings
        run: |
          base=$(git hash-object -t tree /dev/null)
          git diff --check "$base" HEAD
          if git ls-files --eol | grep -E '^i/(crlf|mixed)'; then
            echo "Files above have CRLF line endings in the index." >&2
            exit 1
          fi

  notification-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build portable notification processing probe
        run: dotnet build tools/NotificationIdleProbe -c Release
      - name: Check idle polling and changed-history processing
        run: dotnet run --project tools/NotificationIdleProbe -c Release --no-build -- --self-test

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build SubZeroDev.WindowManager.slnx -c Release
      - name: Build native taskbar diagnostic and check usage entry point
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual C++ x64 tools are required for TaskbarProbe.' }
          & cmd /d /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=x64 && tools\TaskbarProbe\build.cmd"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & artifacts/taskbar-probe/TaskbarProbe.exe
          if ($LASTEXITCODE -ne 2) { throw 'Expected the safe usage-only path to exit 2.' }
          exit 0
      - name: Keep crash dumps
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\SubZeroDev.WindowManager.Host.exe'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -Value "$env:RUNNER_TEMP\dumps" -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -Value 2 -PropertyType DWord -Force | Out-Null
      - name: Test
        env:
          SUBZERODEV_WM_NOTIFICATION_OUT: ${{ runner.temp }}/notification-idle
        run: dotnet test SubZeroDev.WindowManager.slnx -c Release --no-build --logger "console;verbosity=normal"
      - name: Upload notification idle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notification-idle-windows
          path: ${{ runner.temp }}/notification-idle
          if-no-files-found: ignore
      - name: Crash events
        if: failure()
        shell: pwsh
        run: |
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Level = 2; StartTime = (Get-Date).AddHours(-1) } -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'SubZeroDev' } |
            Format-List TimeCreated, ProviderName, Message
      - name: Crash dump stacks
        if: failure()
        shell: pwsh
        run: |
          $dumps = Get-ChildItem "$env:RUNNER_TEMP\dumps" -Filter *.dmp -ErrorAction SilentlyContinue
          if (-not $dumps) { 'No dumps.'; exit 0 }
          dotnet tool install --global dotnet-dump | Out-Null
          foreach ($dump in $dumps) {
            "=== $($dump.Name)"
            dotnet-dump analyze $dump.FullName -c 'pe -nested' -c 'clrthreads' -c 'clrstack -all' -c 'exit'
          }
      - name: Upload crash dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-dumps
          path: ${{ runner.temp }}/dumps
          if-no-files-found: ignore

  budgets:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build SubZeroDev.WindowManager.slnx -c Release
      - name: Startup, idle and replacement startup against the CI budgets
        shell: pwsh
        env:
          SUBZERODEV_WM_BUDGETS: ci
          SUBZERODEV_WM_BUDGET_OUT: ${{ runner.temp }}/budgets
        run: |
          ./tools/Check-Budgets.ps1 -OutputDirectory $env:SUBZERODEV_WM_BUDGET_OUT
          exit $LASTEXITCODE
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budgets
          path: ${{ runner.temp }}/budgets
          if-no-files-found: ignore
