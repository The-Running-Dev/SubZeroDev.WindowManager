name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Whitespace and line endings
        run: |
          base=$(git hash-object -t tree /dev/null)
          git diff --check "$base" HEAD
          if git ls-files --eol | grep -E '^i/(crlf|mixed)'; then
            echo "Files above have CRLF line endings in the index." >&2
            exit 1
          fi

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build SubZeroDev.WindowManager.slnx -c Release
      - name: Test
        run: dotnet test SubZeroDev.WindowManager.slnx -c Release --no-build --logger "console;verbosity=normal"
      - name: Crash events
        if: failure()
        shell: pwsh
        run: |
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Level = 2; StartTime = (Get-Date).AddHours(-1) } -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'SubZeroDev' } |
            Format-List TimeCreated, ProviderName, Message
