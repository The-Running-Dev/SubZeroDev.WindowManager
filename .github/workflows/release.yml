name: Release

on:
  push:
    tags: ['v[0-9]*']
  pull_request:
    paths:
      - 'build/**'
      - 'samples/**'
      - 'src/SubZeroDev.WindowManager.Sdk/**'
      - 'src/SubZeroDev.WindowManager.Protocol/**'
      - 'src/SubZeroDev.WindowManager.PackTool/**'
      - 'src/SubZeroDev.WindowManager.Guardian/**'
      - 'src/SubZeroDev.WindowManager.Host.Surfaces/**'
      - 'docs/acceptance.md'
      - 'docs/acceptance/**'
      - 'tools/Start-AcceptanceVM.ps1'
      - 'tools/Test-AcceptanceVM.ps1'
      - 'tools/Invoke-AcceptanceAuto.ps1'
      - 'tools/acceptance/**'
      - 'tools/TaskbarProbe/**'
      - 'tools/tests/Test-AcceptanceScripts.ps1'
      - 'tools/tests/Test-AcceptanceAuto.ps1'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Version
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '0.1.0-ci.${{ github.run_number }}' }
          "VERSION=$version" >> $env:GITHUB_ENV
      - name: Release, packages and the sample (S15.1, S15.2)
        shell: pwsh
        run: ./build/release.ps1 -Version $env:VERSION
      - name: Built-in plugins match wm-pack (S15.4)
        shell: pwsh
        run: ./build/release.ps1 -Version $env:VERSION -Verify
      - name: Build the end-to-end tests
        run: dotnet build tests/SubZeroDev.WindowManager.EndToEnd.Tests -c Release
      - name: The released host installs the sample (S15.3)
        shell: pwsh
        run: |
          $env:SUBZERODEV_WM_RELEASE_DIR = (Resolve-Path artifacts/release).Path
          $env:SUBZERODEV_WM_SAMPLE_PACKAGE = (Resolve-Path artifacts/sample/example.hello.zip).Path
          $env:SUBZERODEV_WM_FIXTURE_PACKAGE = (Resolve-Path artifacts/sample/example.windows.zip).Path
          dotnet test tests/SubZeroDev.WindowManager.EndToEnd.Tests -c Release --no-build --filter "FullyQualifiedName~SubZeroDev.WindowManager.EndToEnd.Tests.ReleaseTests" --logger "console;verbosity=normal"
      - name: Scripted acceptance suite parses and its decision logic holds
        shell: pwsh
        run: ./tools/tests/Test-AcceptanceAuto.ps1
      - name: Scripted acceptance suite parses under Windows PowerShell 5.1
        shell: powershell
        run: ./tools/tests/Test-AcceptanceAuto.ps1
      - name: Record acceptance build provenance
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem artifacts/SubZeroDev.WindowManager-*.zip | ForEach-Object {
            [ordered]@{ file = $_.Name; bytes = $_.Length; sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          })
          [ordered]@{ commit = '${{ github.sha }}'; version = $env:VERSION; run = '${{ github.run_id }}'; archives = $archives } |
            ConvertTo-Json -Depth 4 | Set-Content artifacts/acceptance-artifacts.json -Encoding utf8
      - name: Build the native taskbar diagnostic for the VM bundle
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual C++ x64 tools are required for TaskbarProbe.' }
          & cmd /d /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=x64 && tools\TaskbarProbe\build.cmd"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & artifacts/taskbar-probe/TaskbarProbe.exe
          if ($LASTEXITCODE -ne 2) { throw 'Expected the safe usage-only path to exit 2.' }
          exit 0
      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.VERSION }}
          path: |
            artifacts/SubZeroDev.WindowManager-*.zip
            artifacts/packages/*.nupkg
            artifacts/acceptance-artifacts.json
            docs/acceptance.md
            docs/acceptance/**
            docs/replacement-mode.md
            docs/taskbar-backchannel-experiment.md
            docs/test-matrix.md
            docs/budgets.md
            tools/Start-AcceptanceVM.ps1
            tools/Test-AcceptanceVM.ps1
            tools/Invoke-AcceptanceAuto.ps1
            tools/acceptance/**
            artifacts/taskbar-probe/TaskbarProbe.exe
      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create '${{ github.ref_name }}' --title '${{ github.ref_name }}' --generate-notes `
            "artifacts/SubZeroDev.WindowManager-$env:VERSION-win-x64.zip" `
            (Get-ChildItem artifacts/packages/*.nupkg).FullName
